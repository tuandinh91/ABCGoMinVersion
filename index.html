<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Go Min Version App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .config-section {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .config-section h2 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .config-content {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            color: #333;
            line-height: 1.6;
        }
        
        .loading {
            color: #999;
            font-style: italic;
        }
        
        .error {
            color: #d32f2f;
        }
        
        .success {
            color: #388e3c;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .info-card {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ABC Go Min Version App</h1>
        <p class="subtitle">Configuration Viewer</p>
        
        <div class="info-card">
            <strong>📋 About:</strong> This application displays configuration from the config.json file hosted on GitHub Pages.
        </div>
        
        <div class="config-section">
            <h2>📄 Configuration</h2>
            <div id="configContent" class="config-content loading">
                Loading configuration...
            </div>
        </div>
        
        <div class="button-group">
            <button onclick="loadConfig()">🔄 Reload Config</button>
            <button onclick="downloadConfig()">⬇️ Download Config</button>
        </div>
    </div>

    <script>
        // Load and display the config.json file
        async function loadConfig() {
            const configContent = document.getElementById('configContent');
            configContent.innerHTML = '<span class="loading">Loading configuration...</span>';
            
            try {
                const response = await fetch('config.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const config = await response.json();
                
                // Display formatted JSON
                configContent.innerHTML = `<span class="success">✓ Configuration loaded successfully</span>\n\n${JSON.stringify(config, null, 2)}`;
                configContent.classList.remove('loading');
            } catch (error) {
                configContent.innerHTML = `<span class="error">✗ Error loading configuration:</span>\n${error.message}`;
                console.error('Error loading config:', error);
            }
        }
        
        // Download the config.json file
        function downloadConfig() {
            const link = document.createElement('a');
            link.href = 'config.json';
            link.download = 'config.json';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // Load config on page load
        window.addEventListener('DOMContentLoaded', loadConfig);
    </script>
</body>
</html>
